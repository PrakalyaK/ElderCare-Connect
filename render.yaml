databases:
  - name: eldercare-db
    plan: free
    databaseName: eldercare
    user: eldercare

services:
  - type: web
    name: eldercare-connect
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eldercare-db
          property: connectionString
